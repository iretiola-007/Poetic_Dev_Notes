<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Poetic Dev Notes</title><style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --accent: #f97316;
}

.dark {
  --bg: #020617;
  --card: #0f172a;
  --text: #e2e8f0;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  font-size: 1.2rem;
}

button {
  cursor: pointer;
}

.icon {
  background: none;
  border: none;
  font-size: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 15px;
}

.card {
  background: var(--card);
  border-radius: 15px;
  padding: 15px;
  min-height: 120px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card:active {
  transform: scale(0.97);
}

.preview {
  font-size: 14px;
  opacity: 0.8;
}

.title {
  font-weight: bold;
  margin-top: 10px;
}

.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  border: none;
  font-size: 24px;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: none;
  flex-direction: column;
}

.modal header {
  border-bottom: 1px solid #ddd;
}

textarea, input {
  border: none;
  outline: none;
  padding: 15px;
  font-size: 16px;
  width: 100%;
  background: transparent;
  color: var(--text);
}

textarea {
  flex: 1;
  resize: none;
}

/* VIEWER */
.viewer {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: none;
  flex-direction: column;
}

.content {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

</style></head><body><header>
  <strong>The Poetic Dev</strong>
  <button class="icon" onclick="toggleDark()">🌙</button>
</header><div class="grid" id="grid"></div><button class="fab" onclick="openEditor()">✎</button>

<!-- EDITOR --><div class="modal" id="editor">
  <header>
    <button class="icon" onclick="closeEditor()">←</button>
    <strong>New Note</strong>
    <button class="icon" onclick="saveNote()">✔</button>
  </header>
  <input id="title" placeholder="Title">
  <textarea id="content" placeholder="Start writing..."></textarea>
</div><!-- VIEWER --><div class="viewer" id="viewer">
  <header>
    <button class="icon" onclick="closeViewer()">←</button>
    <div>
      <button class="icon" onclick="editNote()">✏️</button>
      <button class="icon" onclick="deleteNote()">🗑️</button>
    </div>
  </header>
  <div class="content">
    <h2 id="vTitle"></h2>
    <p id="vContent"></p>
  </div>
</div><script>
let notes = JSON.parse(localStorage.getItem('notes')) || [];
let current = null;

if(localStorage.getItem('dark') === 'true') document.body.classList.add('dark');

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  notes.forEach((n,i)=>{
    const div = document.createElement('div');
    div.className = 'card';
    div.onclick = ()=>openViewer(i);
    div.innerHTML = `
      <div class='preview'>${n.content.slice(0,60)}...</div>
      <div class='title'>${n.title}</div>
    `;
    grid.appendChild(div);
  });
}

function openEditor(edit=false){
  document.getElementById('editor').style.display='flex';
  if(!edit){
    document.getElementById('title').value='';
    document.getElementById('content').value='';
    current=null;
  }
}

function closeEditor(){
  document.getElementById('editor').style.display='none';
}

function saveNote(){
  const title=document.getElementById('title').value;
  const content=document.getElementById('content').value;
  if(!title||!content) return;

  if(current===null){
    notes.unshift({title,content});
  }else{
    notes[current]={title,content};
  }

  localStorage.setItem('notes',JSON.stringify(notes));
  closeEditor();
  render();
}

function openViewer(i){
  current=i;
  document.getElementById('vTitle').innerText=notes[i].title;
  document.getElementById('vContent').innerText=notes[i].content;
  document.getElementById('viewer').style.display='flex';
}

function closeViewer(){
  document.getElementById('viewer').style.display='none';
}

function deleteNote(){
  notes.splice(current,1);
  localStorage.setItem('notes',JSON.stringify(notes));
  closeViewer();
  render();
}

function editNote(){
  document.getElementById('title').value=notes[current].title;
  document.getElementById('content').value=notes[current].content;
  closeViewer();
  openEditor(true);
}

function toggleDark(){
  document.body.classList.toggle('dark');
  localStorage.setItem('dark',document.body.classList.contains('dark'));
}

render();
</script></body>
</html>
